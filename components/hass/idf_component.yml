## The WebSocket client and the JSON parser of the Home Assistant connection
## (docs/architecture.md section 6). ESP-IDF 6 no longer bundles cJSON.
dependencies:
  espressif/esp_websocket_client: "^1.8.0"
  espressif/cjson: "^1.7.19"
  # finding Home Assistant on the network (discover())
  espressif/mdns: "^1.14.0"
  # the JPEG decoder of the camera images (TJpgDec, from the ROM of the ESP32)
  espressif/esp_jpeg: "^1.3.0"
  # the faster software JPEG decoder of the ESP32-S3 (SIMD), media.cpp
  espressif/esp_new_jpeg:
    version: "^1.0.0"
    rules:
      - if: "target == esp32s3"
