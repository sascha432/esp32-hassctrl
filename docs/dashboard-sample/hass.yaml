# ----------------------------------------------------------------------------------------------
# Sample dashboard of hassctrl, and the guide to the file format.
#
# Everything in this folder is made up (entity ids, names), so replace them with yours. It is
# also a test file: tools/host_test.py imports it, so it always matches the firmware.
#
# This is the format of the YAML import of the web UI (Dashboard page, Import & export); the
# device keeps the dashboard in its own file and the web UI edits it. Import takes the whole
# folder at once (all files together). The export writes one file with everything in it, the
# backup file (System page) the settings as well.
#
#   hass.yaml            this file: the settings of the dashboard and the main page
#   rooms.yaml           an area, pulled in with `include`
#   rooms/workshop.yaml  an area inside that area
#
# YAML rules: indent with spaces, any width as long as it is the same within a block (a list may
# also start at the indent of its key). `#` starts a comment. Text with a `#` or a `:` in it
# goes in "quotes". Not supported: tabs, anchors (&, *), tags (!), block text (| and >), maps in
# braces ({ }). Lists in brackets only for plain values. Keys must not repeat. A typo in a key is
# an error with the file and the line, never silently ignored.
# ----------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------- settings
# Besides the dashboard (`defaults`, `tiles`), this file may carry the settings sections of the
# backup file (System page, Backup): `hass`, `network`, `display`, `sound`, `alarm`, `camera`,
# `webui`.
# They are checked together with the dashboard, a problem in either refuses the whole import,
# and applied after it. A section that is not here stays as it is, and so does a field that is
# not in its section. The tokens and passwords below work in both files; an export never writes
# them (it writes a comment where they go).
#
# Commented out here: this folder is imported onto test devices (tools/test_dashboard.py), and
# made-up addresses and passwords would replace their real ones. Remove the `#` of a section to
# use it.
#

# The connection to Home Assistant (the web UI's Home Assistant page sets it as well).
#hass:
#  url: http://homeassistant.local:8123
#  # a long-lived access token (Home Assistant: your profile, Security). Without it the stored
#  # token stays. Sounds from Home Assistant (below, `sound`) need the token of an administrator.
#  token: paste-a-long-lived-access-token-here
#  # only for https with a self-signed certificate: its SHA-256, trusted on the device
#  certificate: "AB:CD:..."

# The web UI login (import only: no export writes it). Replaces the login there is and ends every
# session, so the browser that imports the file has to sign in again. Without the section the
# login stays; the browser setup creates the first one.
#webui:
#  user: admin              # 1 to 32 letters, digits, '.', '_' or '-'
#  password: 8-to-64-characters

# Wi-Fi. The networks of the file come first, then the saved ones that are not in it.
#network:
#  policy: order            # order (of the list) or strongest (signal)
#  hotspot_on: false
#  networks:
#    - name: Office
#      password: the-wi-fi-password    # 8 to 64 characters; without it a saved one keeps its own
#    - name: Guest
#      open: true                      # no password

# The device's own camera stream, for boards with a camera (Settings, Camera on the screen or
# the web UI). The stream needs a login; a new `stream_user` drops the stored password.
#camera:
#  stream: true
#  stream_size: full        # full or half
#  stream_fps: 10           # 5, 10, 15 or 30
#  stream_quality: 80       # 30 to 95
#  stream_user: viewer      # at most 32 characters
#  stream_password: at-most-32-characters
#  # the picture: mains_hz (50, 60), auto_exposure, brightness (-50 to 50), exposure_us, gain
#  # (16 to 248, 16 = 1x), mirror, flip

# The screen.
#display:
#  brightness: 80           # 1 to 100
#  dim_brightness: 20       # 1 to 100
#  dim_after_s: 60          # 0 to 3600
#  off_after_s: 600         # 0 to 86400
#  automatic: true          # brightness from the light sensor
#  rotation: 0              # 0, 90, 180, 270
#  rotation_locked: false
#  # `automatic`: the light in the room at the lowest and at full brightness, linear between
#  light_min_lx: 0          # 0 to 100000, less than light_max_lx
#  light_max_lx: 350        # 1 to 100000

# Sounds and vibration, on boards that have them.
#
# Home Assistant makes a device with a speaker talk or play an MP3 with the event `hassctrl_say`,
# no setting here (an action in an automation or script of Home Assistant, not in this file):
#
#   - event: hassctrl_say
#     event_data:
#       device: hassctrl-1a2b     # its name (top of its web UI); without it every device plays
#       message: The washing machine is done
#       engine: tts.google_en_com # a text-to-speech entity of Home Assistant
#       language: en              # optional
#       options:                  # optional, the engine's own (Google Translate: tld, the accent)
#         tld: co.uk
#       # or instead of message: url: /local/doorbell.mp3 (a file of Home Assistant's www folder,
#       # or a whole http(s) address), an MP3 of at most 1 MB
#
# Developer tools, Events fires it by hand (event type hassctrl_say, the event_data as data).
#
# Relays: a board with relay GPIOs (the JC4880P443C: relay 1) follows entities of Home Assistant,
# no setting here: `input_boolean.<device>_relay_<n>` or `switch.<device>_relay_<n>`, <device> the
# name of the device with "_" (hassctrl-7e7d: input_boolean.hassctrl_7e7d_relay_1). On = GPIO high.
#
# Motion sensor: a board with a motion GPIO (the JC4880P443C) sets a text helper of Home Assistant
# to "Occupied" or "Clear", no setting here. Create it in Home Assistant (Settings, Devices,
# Helpers, Text) with the entity id `input_text.<device>_motion` (hassctrl-7e7d:
# input_text.hassctrl_7e7d_motion); without it the log says so once per connection.
#
# It plays at the volume below; an alarm that rings comes first.
#sound:
#  volume: 50               # 0 to 100
#  tap_sound: true
#  slider_sound: true
#  vibration: true

# The alarm clock, on boards with a speaker.
#alarm:
#  on: true
#  time: "07:00"
#  days: [mon, tue, wed, thu, fri]   # [] for once, then it turns itself off
#  snooze_min: 9            # 1 to 60

# A camera tile's `stream:` URL (below) cannot carry a login yet: `http://user:password@host/`
# is not sent to the server (docs/TODO.md).

# --------------------------------------------------------------------------------- dashboard
# Defaults for the whole dashboard.
defaults:
  # columns x rows of every page, 1x1 to 32x32. Default 4x2. A cell is the unit of every size
  # below. A 480x320 panel with 4x2 has cells of about 110x148 pixels; a portrait panel shows the
  # grid turned (4x3 becomes 3x4), the tiles keep their order.
  grid: 4x3

# The main page. Tiles fill the grid in the order of this list, left to right and top to bottom,
# each in the first place where it fits; a `spacer` keeps a cell free. A tile that finds no room
# is left out on the screen, never an error: the web editor lists it under the preview, and it
# comes back when room is made. A page can also be arranged with a cell per tile (`cell` under
# `landscape:` / `portrait:`, see rooms/workshop.yaml), which the edit mode of the screen writes
# when you move a tile.
#
# Every tile is one cell unless `landscape:` and `portrait:` say otherwise:
#   landscape:
#     size: 1x2       columns x rows, 1x1 to 8x8 (larger than the grid: left out); default 1x1
#     cell: 2,1       column,row from 0: the place on an arranged page; without it the tile
#                     takes the first free place
#     hidden: true    the tile is not on the screen in this orientation
#   portrait:         the same for the turned screen, in the turned grid (4x3 becomes 3x4). The
#                     portrait size is the landscape size turned (1x2 becomes 2x1) unless set.
#
# What a tile is, is decided by its entity (the domain before the dot):
#   light.*                                         switch, or a dimmer with `dimmer: true`
#   switch.* input_boolean.* fan.* automation.*     switch: a tap toggles
#   button.* input_button.* scene.* script.*        button: a tap presses
#   climate.*                                       thermostat; two rows tall it has +/- bars
#   camera.*                                        camera picture, fills the tile
#   lock.*                                          lock: a tap opens the panel (lock, unlock,
#                                                   open, the timeline); the tile does not unlock
#   weather.*                                       weather: the condition, the temperature and
#                                                   the humidity; a tap opens the current values
#                                                   and the daily and hourly forecast
#   everything else (sensor.*, binary_sensor.*, ...)
#                                                   shows the state, a tap opens the history
# Only `area` and `spacer` have a `type`. Every key except `entity` is optional.
tiles:
  # A light as a dimmer: level fill from the bottom, drag to set the level, double tap to switch,
  # tap for the light panel (colors, effects). Two rows tall, so the fill has room.
  - entity: light.aurora_ceiling
    name: Ceiling
    dimmer: true
    landscape:
      size: 1x2
    # the +/- buttons of the light panel change the level by this many percent. 1 to 50,
    # default 1. The slider itself is continuous.
    step: 5

  # A thermostat, two rows tall: the +/- bars change the target temperature by the step the
  # thermostat reports; `step` (0.1 to 5, in degrees) is used when it reports none, else 0.5
  # (1 for °F). In one cell it shows the action, the temperatures and the name.
  - entity: climate.hearth_thermostat
    name: Hearth
    landscape:
      size: 1x2

  # A switch. Without `name`, Home Assistant's friendly name is shown.
  - entity: switch.crystal_lamp

  # `icon`: a Material Design Icons name (mdi.com/icons) from the list the firmware holds;
  # `none` shows no icon. Without it the icon follows the domain and the device class like in
  # Home Assistant (a lamp, a plug, a thermometer, ...).
  - entity: fan.breeze_machine
    name: Breeze
    icon: fan

  # A sensor. `unit` replaces the unit Home Assistant reports (up to 12 bytes), `decimals`
  # (0 to 6) replaces the precision Home Assistant displays the value with.
  - entity: sensor.moonbase_temperature
    name: Moonbase
    icon: thermometer
    unit: "°C"
    decimals: 1

  # Keeps its cell free.
  - type: spacer

  # A camera: the image fills the tile, whatever its size. `refresh` is the seconds between two
  # images, 1 to 3600 (default 60); images are only fetched while the page is visible. A tap
  # shows the image full screen. `stream` (optional) is an MJPEG stream of the camera (http://,
  # for example of go2rtc): the tile takes its image from the stream instead of Home Assistant,
  # and full screen plays it live. `stream: hass` plays Home Assistant's own MJPEG stream of the
  # camera full screen. One stream plays at a time.
  - entity: camera.owl_cam
    name: Owl
    landscape:
      size: 2x1
    refresh: 30
    # full screen plays Home Assistant's MJPEG stream of the camera
    stream: hass

  # An area is a page of its own. The first cell of its page is the back tile, unless the area
  # has `swipe: true` (see rooms/workshop.yaml). The name is required. `tiles` is the list of
  # its page; `include` takes it from another file.
  - include: rooms.yaml

  # A button: a tap presses it (`scene` and `script` entities are activated).
  - entity: scene.movie_night
    name: Movie Night
    icon: lightbulb
