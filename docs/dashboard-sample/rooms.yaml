# An included file is a list of tiles that starts at the first column, however deep it is
# included. It stands where the `include` entry stood, so the order of the page stays the order
# of the files. Paths are relative to the file that includes, nesting up to 4 levels, no
# absolute paths and nothing outside the uploaded files. An include entry has no other keys.
#
# An area written out: it can sit in the file of its parent as well (indent its `tiles`).
- type: area
  name: Rooms
  # the grid of this page, 1x1 to 32x32. Without it the page uses `defaults.grid`.
  grid: 3x3
  tiles:
    - entity: lock.stardust_gate
      name: Front Gate
    - entity: binary_sensor.owl_motion
      name: Motion
      icon: motion-sensor
    - include: rooms/workshop.yaml
    - entity: camera.owl_cam
      name: Owl Closeup
      # two cells wide on the landscape screen; the portrait size is the landscape size turned
      # (1x2, tall) unless set: here it stays wide on the turned screen
      landscape:
        size: 2x1
      portrait:
        size: 2x1
      # an MJPEG stream of its own (here of go2rtc): the tile's image comes from it, full screen
      # plays it live. In quotes, it has a `:` in it.
      stream: "http://go2rtc.local:1984/api/stream.mjpeg?src=owl_closeup"
    # A weather entity (OpenWeatherMap, Met.no, ...): its icon follows the condition. In one
    # cell: the temperature with the icon, the condition and the humidity in a line; a tall tile
    # (1x2) stacks them with the large icon, a wide one (2x1) puts the icon beside them. The
    # forecast in its panel is the one the integration offers.
    - entity: weather.openweathermap
      name: Weather
    # A clock (no entity): the time of the device, or of `zone`, an IANA name as Home Assistant
    # lists them (Europe/London, America/New_York). `hours: 12` shows AM/PM (default 24),
    # `seconds: true` adds the seconds, `date: true` the date under the time ("Tue 13 Oct").
    # `name` stands under the time; the digits grow with the tile (1x1, 2x1, 2x2).
    - type: clock
      name: London
      zone: Europe/London
      hours: 12
      date: true
    # An automation: the tile shows the time of its last run (Disabled while it is off). A double
    # tap runs its actions, a tap opens the panel: the Enabled switch, the last run, Run actions
    # and the timeline. A script (rooms/workshop.yaml) is the same tile without the switch.
    - entity: automation.gate_alarm
      name: Gate Alarm
