<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">

<title>hassctrl dashboard editor (demo)</title>
<!-- Demo of docs/ui/web/web-dashboard-editor.md. Open this file directly in a browser: it uses the web UI's
     own Bootstrap file, mock data, and saves nothing. Icons are rough stand-ins; the real ones
     come from web/icons.svg (MDI paths, tools/build_icons.py). -->
<link rel="stylesheet" href="../../../web/vendor/bootstrap.min.css">
<script>
  (function () {
    var mode = "auto";
    try { mode = localStorage.getItem("theme") || "auto"; } catch (e) {}
    var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  /* app.css of the web UI, the parts the frame needs */
  .app-body { display: flex; min-height: calc(100vh - 57px); }
  .app-page { margin: 0 auto; width: 100%; min-width: 0; }
  .app-page h1 { font-size: 1.4rem; margin-bottom: 0; }
  .app-menu { position: fixed; top: 57px; left: 0; right: 0; bottom: 0; z-index: 1020; overflow-y: auto; }
  @media (min-width: 800px) {
    .app-menu { position: sticky; top: 57px; width: 220px; height: calc(100vh - 57px); flex-shrink: 0; }
    .app-menu[hidden] { display: block !important; }
    #menu-button { display: none; }
  }
  .state-icon { display: inline-flex; align-items: center; }
  .state-icon.ok { color: var(--bs-success); }
  .app-toast { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); z-index: 1100; max-width: 90vw; }

  /* editor */
  .ed { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .ed-tree-list { display: none; }
  @media (min-width: 800px) {
    .ed { grid-template-columns: 200px minmax(0, 1fr); }
    .ed-insp { grid-column: 1 / -1; }
    .ed-tree-list { display: block; }
    .ed-tree-select { display: none; }
  }
  @media (min-width: 1280px) {
    .ed { grid-template-columns: 210px minmax(0, 1fr) 330px; }
    .ed-insp { grid-column: auto; }
  }
  .tree .list-group-item { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .tree .list-group-item.drop-target { outline: 2px dashed var(--bs-primary); outline-offset: -2px; }
  .tree .count { font-size: .75rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .toolbar .grow { flex: 1; }
  .ctl-row { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin-bottom: .75rem; }
  .ctl-row .form-select { width: auto; }
  .grid-pick { display: inline-flex; align-items: center; gap: .25rem; }
  .grid-pick .form-select { padding-right: 1.8rem; }
  .insp .form-label { margin-bottom: .2rem; font-size: .875rem; color: var(--bs-secondary-color); }
  .insp .row-field { margin-bottom: .6rem; }
  .icon-chip { display: inline-flex; align-items: center; gap: .4rem; }
  .icon-chip svg { width: 20px; height: 20px; }
  .problem { cursor: pointer; }
  pre.code { max-height: 60vh; overflow: auto; font-size: .8rem; background: var(--bs-tertiary-bg); padding: .75rem; border-radius: .375rem; }

  /* the board: drawn in screen pixels, scaled to fit */
  .board-wrap { position: relative; width: 100%; max-width: 760px; }
  .board-scale { position: relative; overflow: hidden; }
  .board { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #0b0f14; color: #fff;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; touch-action: none; overflow: hidden; }
  .tile { position: absolute; background: #182029; border: 1px solid #2b3844; border-radius: 8px; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #7fa8c9; }
  .tile .nm { padding: 0 6px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .val { color: #fff; white-space: nowrap; }
  .tile svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tile.on { background: #ff8000; border-color: #ff8000; color: #fff; }
  .tile.dim .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #ff8000; opacity: .9; }
  .tile.dim > *:not(.fill) { position: relative; }
  .tile.dim .nm { position: absolute; bottom: 6px; color: #fff; }
  .tile.climate { justify-content: space-between; padding: 4px 0; }
  .tile.climate .bar { width: calc(100% - 10px); border-radius: 6px; background: #ff8000; color: #fff; display: flex; align-items: center; justify-content: center; }
  .tile.climate .act { color: #ff8000; }
  .tile.pic { background: linear-gradient(160deg, #3b5a6e 0%, #1f3240 45%, #4a3b2a 100%); justify-content: flex-end; }
  .tile.pic .band { width: 100%; background: rgba(0,0,0,.55); color: #fff; padding: 3px 0; }
  .tile.spacer { background: transparent; border: 1px dashed #2b3844; color: #4d6274; }
  .tile.back { color: #7fa8c9; }
  .tile.area { color: #7fa8c9; }
  .tile.err { box-shadow: inset 0 0 0 3px #ff0000; }
  .tile.fallback { box-shadow: inset 0 0 0 3px #ffb000; opacity: .75; }
  .tile.sel { box-shadow: 0 0 0 3px #00ffff; z-index: 2; }
  .tile.drop-before::before, .tile.drop-after::before { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: #00ffff; }
  .tile.drop-before::before { left: 0; }
  .tile.drop-after::before { right: 0; }
  .tile.pinned::after { content: ""; position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: #00ffff; }
  .cell-empty { position: absolute; border: 1px dashed #2b3844; border-radius: 8px; display: flex; align-items: center; justify-content: center;
                color: #4d6274; font-size: 22px; cursor: pointer; }
  .cell-empty:hover { color: #00ffff; border-color: #00ffff; }
  .hl { position: absolute; border-radius: 8px; pointer-events: none; z-index: 5; }
  .hl.ok { border: 3px solid #2ecc71; background: rgba(46,204,113,.15); }
  .hl.no { border: 3px solid #ff0000; background: rgba(255,0,0,.12); }

  /* modals without Bootstrap's script */
  .modal.show-it { display: block; }
  .ent-list { max-height: 50vh; overflow-y: auto; }
  .ent-list .list-group-item { cursor: pointer; }
  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .4rem; max-height: 50vh; overflow-y: auto; }
  .icon-grid button { display: flex; flex-direction: column; align-items: center; gap: .25rem; font-size: .7rem; padding: .5rem .25rem; }
  .icon-grid svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-chip svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

<script>

// core::icon_names()
const ICONS = ["brightness-6", "camera", "checkbox-marked-circle", "current-ac", "door-closed", "door-open", "eye", "fan",
  "fan-off", "flash", "flash-off", "folder", "gauge", "gesture-tap-button", "home", "home-assistant", "lightbulb",

  "motion-sensor-off", "palette", "power", "power-plug", "power-plug-off", "radiator", "radiobox-blank", "remote", "robot",
  "robot-off", "script-text", "sine-wave", "thermometer", "thermostat", "toggle-switch", "toggle-switch-off",
  "water-percent", "window-closed", "window-open"];

const BOARDS = {

  jc3248: { name: "JC3248W535", w: 480, h: 320 },

// ------------------------------------------------------------------------------- icon stand-ins

const SHAPES = {
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  power: '<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',

// ------------------------------------------------------------------------------------- helpers

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clone = (v) => JSON.parse(JSON.stringify(v));

let toastTimer;
function toast(text, kind = "secondary") {
  const t = $("#toast");
  t.className = `app-toast alert alert-${kind} py-2 shadow-sm`;
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 3000);
}

// ---------------------------------------------------------------------------------------- state

let K = 1; // local keys: new tiles have no id until the device gives them one
function keyAll(tiles) { for (const t of tiles) { if (!t._k) t._k = K++; if (t.tiles) keyAll(t.tiles); } }

let doc = clone(STORED); keyAll(doc.tiles);
let saved = clone(doc);
let undoStack = [];
let dirty = false;
let tab = "editor";
let pageKey = 0;        // 0: the main page, else the _k of the area tile
let sel = null;         // _k of the selected tile
let orient = "l";       // l: landscape, p: portrait
let board = "wt32";
let conflictNext = false;
let conflict = false;
let check = { state: "ok", text: "", k: null };
let checkTimer;
const states = Object.fromEntries(HA.map((e) => [e.id, { ...e }]));

function change(fn) {
  undoStack.push(JSON.stringify(doc));
  if (undoStack.length > 50) undoStack.shift();
  fn();
  dirty = true;
  scheduleCheck();
  render();
}

// the device's check=1, a second after the last change
function scheduleCheck() {
  check = { state: "checking", text: "", k: null };
  clearTimeout(checkTimer);
  checkTimer = setTimeout(() => {
    const p = validate();
    check = p ? { state: "error", text: p.text, k: p.k } : { state: "ok", text: "", k: null };
    renderToolbar();
  }, 1000);
}

// --------------------------------------------------------------------------------------- model

function kindOf(t) {
  if (t.type) return t.type;
  const d = (t.entity || "").split(".")[0];
  if (d === "light") return "light";
  if (["switch", "input_boolean", "fan", "automation"].includes(d)) return "switch";
  if (["button", "input_button", "scene", "script"].includes(d)) return "button";

    else if (p.key !== 0 && c === 0 && r === 0) res.errors[t._k] = `the ${o === "p" ? "portrait" : "landscape"} cell 0,0 is the back tile's`;
    else if (!fits(c, r, w, h)) res.errors[t._k] = `the ${o === "p" ? "portrait" : "landscape"} cell ${c},${r} overlaps another tile`;

function validate() {
  for (const p of pages()) {

    for (const t of p.tiles) if (!t.type && !validEntity(t.entity || "")) return { k: t._k, text: `${tileLabel(t)}: '${t.entity}' is not an entity id` };
    for (const o of ["l", "p"]) {
      const pl = place(p, o);

    }

}

// Moves a tile to a cell; the whole page gets its current cells in that orientation, and the tiles
// in the way are pushed aside: each takes the first free block in reading order from the drop cell
// on, wrapping to the start, in their old order (docs/ui/lvgl/lvgl-dashboard.md section 6). False when one
// of them finds no block.
function arrangeMove(p, o, k, c, r) {

  const inBlock = (cell) => cell.c < c + w && cell.c + cell.w > c && cell.r < r + h && cell.r + cell.h > r;
  const placed = p.tiles.filter((x) => pl.cells[x._k] && !pl.fallback[x._k] && x._k !== k);
  const pushed = placed.filter((x) => inBlock(pl.cells[x._k]));
  const used = Array.from({ length: pl.R }, () => Array(pl.C).fill(false));
  const take = (cc, rr, ww, hh) => { for (let y = rr; y < rr + hh; y++) for (let x = cc; x < cc + ww; x++) used[y][x] = true; };
  const free = (cc, rr, ww, hh) => {
    if (cc + ww > pl.C || rr + hh > pl.R) return false;
    for (let y = rr; y < rr + hh; y++) for (let x = cc; x < cc + ww; x++) if (used[y][x]) return false;
    return true;

  for (const x of placed) if (!pushed.includes(x)) { const q = pl.cells[x._k]; take(q.c, q.r, q.w, q.h); }

    moved.set(x._k, found);
  }
  for (const x of placed) x[key] = moved.get(x._k) || [pl.cells[x._k].c, pl.cells[x._k].r];

// ------------------------------------------------------------------------------------ tile look

function autoIcon(t) {
  const k = kindOf(t), e = HA_BY_ID[t.entity] || {}, st = states[t.entity] || {}, on = st.s === "on";
  if (k === "area") return "folder";
  if (k === "light") return on ? "lightbulb" : "lightbulb-off";
  if (k === "climate") return "thermostat";
  if (k === "picture") return "camera";
  const d = (t.entity || "").split(".")[0];
  if (d === "fan") return on ? "fan" : "fan-off";
  if (d === "scene") return "palette";
  if (d === "script") return "script-text";
  if (d === "automation") return on ? "robot" : "robot-off";
  if (d === "lock") return st.s === "locked" ? "lock" : "lock-open";
  if (d === "button" || d === "input_button") return "gesture-tap-button";
  if (e.dc === "outlet") return on ? "power-plug" : "power-plug-off";
  if (e.dc === "temperature") return "thermometer";
  if (e.dc === "humidity") return "water-percent";
  if (e.dc === "power") return "flash";
  if (e.dc === "carbon_dioxide") return "molecule-co2";
  if (e.dc === "motion") return on ? "motion-sensor" : "motion-sensor-off";
  if (e.dc === "door") return on ? "door-open" : "door-closed";

}
const iconOf = (t) => t.icon || autoIcon(t);

function stateText(t) {
  const e = HA_BY_ID[t.entity], st = states[t.entity];
  if (!e || !st) return "--";
  const d = t.entity.split(".")[0];
  if (d === "binary_sensor") {
    if (e.dc === "motion") return st.s === "on" ? "Detected" : "Clear";
    if (e.dc === "door") return st.s === "on" ? "Open" : "Closed";
    return st.s === "on" ? "On" : "Off";
  }
  if (d === "lock") return st.s === "locked" ? "Locked" : "Unlocked";
  const n = parseFloat(st.s);
  if (!isNaN(n)) {
    const dec = t.decimals ?? e.p ?? 1;
    return `${n.toFixed(dec)} ${esc(t.unit || e.u || "")}`.trim();
  }

}

// one tile in screen pixels
function tileHTML(t, box, large, flags = "") {
  const k = kindOf(t), nm = esc(displayName(t)), st = states[t.entity] || {};
  const fs = { icon: large ? 48 : 24, val: large ? 28 : 20, name: large ? 16 : 12 };
  const style = `left:${box.x}px;top:${box.y}px;width:${box.w}px;height:${box.h}px`;
  const attrs = `data-k="${t._k}" style="${style}" draggable="true"`;
  const name = `<div class="nm" style="font-size:${fs.name}px">${nm}</div>`;
  const icon = (px) => (iconOf(t) === "none" ? "" : svg(iconOf(t), px));
  if (k === "spacer") return `<div class="tile spacer ${flags}" ${attrs}><div class="nm" style="font-size:12px">spacer</div></div>`;
  if (k === "area") return `<div class="tile area ${flags}" ${attrs}>${icon(fs.icon)}${name}</div>`;
  if (k === "picture") return `<div class="tile pic ${flags}" ${attrs}><div class="band" style="font-size:${fs.name}px">${nm}</div></div>`;
  if (k === "light" && t.dimmer) {

    return `<div class="tile dim ${flags}" ${attrs}><div class="fill" style="height:${lvl}%"></div>

  }

    }

      <div class="act" style="font-size:${fs.name}px">${esc(st.a || "")}</div><div class="val" style="font-size:${fs.val}px">${st.t ?? "--"}°</div>

// the geometry of a page on a board: 8 px from the edges, 4 px between tiles (docs/ui/lvgl/lvgl-dashboard.md)
function geometry(p, o) {
  const b = BOARDS[board], W = o === "p" ? b.h : b.w, H = o === "p" ? b.w : b.h;
  const pl = place(p, o);
  const cw = (W - 16 - 4 * (pl.C - 1)) / pl.C, ch = (H - 16 - 4 * (pl.R - 1)) / pl.R;
  const box = (c, r, w, h) => ({ x: 8 + c * (cw + 4), y: 8 + r * (ch + 4), w: w * cw + (w - 1) * 4, h: h * ch + (h - 1) * 4 });

function boardHTML(p, o) {
  const g = geometry(p, o), pl = g.pl;
  let html = "";
  if (p.key !== 0) html += `<div class="tile back" data-back="1" style="left:8px;top:8px;width:${g.cw}px;height:${g.ch}px">${svg("arrow-left", g.large ? 48 : 24)}</div>`;
  {
    for (let r = 0; r < pl.R; r++) for (let c = 0; c < pl.C; c++) if (pl.used[r][c] === null) {
      const b = g.box(c, r, 1, 1);
      html += `<div class="cell-empty" data-act="add" data-c="${c}" data-r="${r}" title="Add a tile here" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px">+</div>`;
    }
  }
  for (const t of p.tiles) {
    const cell = pl.cells[t._k];
    if (!cell) continue;
    const b = g.box(cell.c, cell.r, cell.w, cell.h);
    let flags = "";
    if (sel === t._k) flags += " sel";

        <div class="board-wrap" id="ed-wrap"><div class="board-scale"><div class="board" id="ed-board"></div></div></div>
        ${missing.length ? `<div class="alert alert-danger py-2 small mt-2 mb-0">Not on the page: ${missing.map((t) => `<a href="#" data-act="select" data-k="${t._k}">${esc(displayName(t))}</a>`).join(", ")}</div>` : ""}
        ${Object.keys(pl.fallback).length ? `<div class="alert alert-warning py-2 small mt-2 mb-0">In portrait ${Object.keys(pl.fallback).length} tile(s) find no free block and fall back to the first cell (outlined in yellow).</div>` : ""}
        <div id="problem-box" class="mt-2"></div>
        <div class="d-flex flex-wrap gap-2 mt-2">
          <button class="btn btn-sm btn-outline-primary" data-act="add">+ Tile</button>
          <button class="btn btn-sm btn-outline-secondary" data-act="add-area" ${p.depth >= 5 ? "disabled" : ""}>+ Area</button>
          <button class="btn btn-sm btn-outline-secondary" data-act="add-spacer">+ Spacer</button>
        </div>
      </div>
      <div class="ed-insp"><div class="card mb-0"><div class="card-body insp" id="insp"></div></div></div>
    </div>`;
  const b = boardHTML(p, orient);
  const el = $("#ed-board");
  el.innerHTML = b.html;
  el.style.width = b.g.W + "px";
  el.style.height = b.g.H + "px";
  fitBoard($("#ed-wrap"), b.g, 0.62);
  wireEditorDrag(el, p);
  renderInspector();
  renderToolbar();
}

// scales a board of W x H screen pixels to the width of its box
function fitBoard(wrap, g, maxVh) {
  const s = Math.min(wrap.clientWidth / g.W, (innerHeight * maxVh) / g.H, 1.8);
  const scale = wrap.querySelector(".board-scale");
  scale.style.width = g.W * s + "px";
  scale.style.height = g.H * s + "px";
  scale.querySelector(".board").style.transform = `scale(${s})`;
  wrap.dataset.s = s;
}

function isInside(pageKeyToTest, areaK) {
  let p = pageByKey(pageKeyToTest);
  while (p) { if (p.key === areaK) return true; if (p.parent === null) return false; p = pageByKey(p.parent); }
  return false;
}

// ------------------------------------------------------------------------------ editor dragging

let drag = null;
function wireEditorDrag(el, p) {
  const s = () => +$("#ed-wrap").dataset.s;
  const g = () => geometry(p, orient);
  const pointerCell = (e) => { const r = el.getBoundingClientRect(); return g().cellAt((e.clientX - r.left) / s(), (e.clientY - r.top) / s()); };
  const clearMarks = () => { el.querySelectorAll(".drop-before, .drop-after").forEach((x) => x.classList.remove("drop-before", "drop-after")); $("#ed-hl")?.remove(); };
  // automatic order: the dragged tile takes the target's place in the list, so a drag forward lands
  // after the target and a drag backward before it (the last tile can be passed too)
  const forward = (k, target) => p.tiles.findIndex((x) => x._k === k) < p.tiles.findIndex((x) => x._k === target);
  el.addEventListener("dragstart", (e) => {
    const t = e.target.closest("[data-k]");
    if (!t) return;
    const k = +t.dataset.k, cell = place(p, orient).cells[k], pc = pointerCell(e);
    drag = { k, dc: pc.c - cell.c, dr: pc.r - cell.r };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(k));
  });
  el.addEventListener("dragend", () => { drag = null; clearMarks(); });
  el.addEventListener("dragover", (e) => {
    if (!drag) return;
    e.preventDefault();
    clearMarks();
    const pl = place(p, orient), pc = pointerCell(e), under = pl.used[pc.r]?.[pc.c];
    if (!pl.arranged && typeof under === "number" && under !== drag.k) {
      el.querySelector(`.tile[data-k="${under}"]`)?.classList.add(forward(drag.k, under) ? "drop-after" : "drop-before");
      return;
    }
    const t = locate(drag.k).tile, [w, h] = spanOf(t, orient), c = pc.c - drag.dc, r = pc.r - drag.dr;
    const trial = JSON.parse(JSON.stringify(p.tiles)); // try on a copy
    const ok = arrangeMove({ ...p, tiles: trial }, orient, drag.k, c, r);
    const b = g().box(c, r, w, h);
    el.insertAdjacentHTML("beforeend", `<div id="ed-hl" class="hl ${ok ? "ok" : "no"}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"></div>`);
  });
  el.addEventListener("drop", (e) => {
    if (!drag) return;
    e.preventDefault();
    const d = drag; drag = null;
    const pl = place(p, orient), pc = pointerCell(e), under = pl.used[pc.r]?.[pc.c];
    if (!pl.arranged && typeof under === "number" && under !== d.k) {
      change(() => {
        const to = p.tiles.findIndex((x) => x._k === under);
        const [t] = p.tiles.splice(p.tiles.findIndex((x) => x._k === d.k), 1);
        p.tiles.splice(to, 0, t);
      });
      return;
    }
    const trial = JSON.parse(JSON.stringify(p.tiles));
    if (!arrangeMove({ ...p, tiles: trial }, orient, d.k, pc.c - d.dc, pc.r - d.dr)) { clearMarks(); toast("The tile does not fit there.", "warning"); return; }
    change(() => { arrangeMove(pageByKey(p.key), orient, d.k, pc.c - d.dc, pc.r - d.dr); sel = d.k; });
    if (!pl.arranged) toast(`The page is now arranged in ${orient === "p" ? "portrait" : "landscape"}.`, "info");
  });
}

// the page tree takes tiles too: move to another page
document.addEventListener("dragover", (e) => {
  const item = e.target.closest?.(".tree [data-page]");
  document.querySelectorAll(".tree .drop-target").forEach((x) => x.classList.remove("drop-target"));
  if (!item || !drag || +item.dataset.page === pageKey) return;
  e.preventDefault();
  item.classList.add("drop-target");
});
document.addEventListener("drop", (e) => {
  const item = e.target.closest?.(".tree [data-page]");
  if (!item || !drag) return;
  e.preventDefault();
  moveToPage(drag.k, +item.dataset.page);
  drag = null;
});
function moveToPage(k, target) {
  const loc = locate(k);
  if (loc.tile.type === "area" && isInside(target, k)) { toast("An area cannot go into itself.", "warning"); return; }
  change(() => {
    const [t] = loc.page.tiles.splice(loc.index, 1);
    delete t.landscape; delete t.portrait;
    pageByKey(target).tiles.push(t);
  });
  toast(`Moved to ${pageByKey(target).name}.`, "success");
}

// --------------------------------------------------------------------------- import & export

function yamlText() {
  const q = (s) => (/^[A-Za-z0-9_][A-Za-z0-9_ .\/-]*$/.test(s) && !/\s$/.test(s) && !/^(true|false|null|yes|no|\d)/i.test(s) ? s : JSON.stringify(s));
  const tilesYaml = (tiles, ind) => tiles.map((t) => {
    const l = [];
    if (t.type) l.push(`type: ${t.type}`);
    if (t.entity) l.push(`entity: ${t.entity}`);
    if (t.name) l.push(`name: ${q(t.name)}`);
    if (t.dimmer) l.push("dimmer: true");
    if (t.icon) l.push(`icon: ${q(t.icon)}`);
    if (t.size) l.push(`size: ${t.size[0]}x${t.size[1]}`);
    if (t.landscape) l.push(`landscape: ${t.landscape[0]},${t.landscape[1]}`);
    if (t.portrait) l.push(`portrait: ${t.portrait[0]},${t.portrait[1]}`);
    if (t.step !== undefined) l.push(`step: ${t.step}`);
    if (t.unit) l.push(`unit: ${q(t.unit)}`);
    if (t.decimals !== undefined) l.push(`decimals: ${t.decimals}`);
    if (t.refresh !== undefined) l.push(`refresh: ${t.refresh}`);
    if (t.stream) l.push(`stream: ${q(t.stream)}`);
    if (t.grid) l.push(`grid: ${t.grid[0]}x${t.grid[1]}`);
    let out = l.map((x, i) => (i ? ind + "  " : ind + "- ") + x).join("\n") + "\n";
    if (t.tiles) out += `${ind}  tiles:\n` + tilesYaml(t.tiles, ind + "    ");
    return out;
  }).join("");
  return `# hassctrl dashboard (GET /api/dashboard.yaml)\ndefaults:\n  grid: ${doc.defaults.grid[0]}x${doc.defaults.grid[1]}\ntiles:\n` + tilesYaml(doc.tiles, "  ");
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ----------------------------------------------------------------------------------- save, ids

function assignIds() {
  (function rec(ts) { for (const t of ts) { if (!t.id) t.id = doc.next_id++; if (t.tiles) rec(t.tiles); } })(doc.tiles);
}
function save(force = false) {
  const p = validate();
  if (p) { check = { state: "error", text: p.text, k: p.k }; renderToolbar(); toast("400: " + p.text, "danger"); return; }
  if (conflictNext && !force) {
    conflict = true;
    $("#conflict").innerHTML = `<div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 py-2">
      <span class="flex-grow-1"><b>409</b>: the dashboard was changed on the device (revision ${doc.revision + 1}) after this page loaded it.</span>
      <button class="btn btn-sm btn-outline-secondary" data-act="c-reload">Reload (drop my changes)</button>
      <button class="btn btn-sm btn-warning" data-act="c-overwrite">Overwrite</button></div>`;
    return;
  }
  if (force) doc.revision++;
  conflictNext = false;
  conflict = false;
  assignIds();
  doc.revision++;
  saved = clone(doc);
  dirty = false;
  toast(`Saved: revision ${doc.revision}. The screen reloads the dashboard.`, "success");
  render();
}

// ------------------------------------------------------------------------------------- actions

const actions = {
  tab: (el) => { tab = el.dataset.tab; render(); },
  page: (el) => { pageKey = +el.dataset.page; sel = null; render(); },
  select: (el) => { const loc = locate(+el.dataset.k); if (!loc) return; pageKey = loc.page.key; sel = +el.dataset.k; render(); },
  orient: (el) => { orient = el.dataset.o; render(); },
  undo: () => { if (!undoStack.length) return; doc = JSON.parse(undoStack.pop()); dirty = JSON.stringify(doc) !== JSON.stringify(saved); scheduleCheck(); render(); },
  discard: () => { doc = clone(saved); undoStack = []; dirty = false; sel = null; scheduleCheck(); render(); },
  save: () => save(),
  "c-reload": () => { conflictNext = false; doc = clone(saved); doc.revision++; saved = clone(doc); dirty = false; undoStack = []; render(); toast("Reloaded the device's dashboard.", "info"); },
  "c-overwrite": () => save(true),
  "goto-problem": () => { if (check.k) actions.select({ dataset: { k: check.k } }); },
  add: (el) => openAdd(el.dataset.c !== undefined ? { c: +el.dataset.c, r: +el.dataset.r } : null),
  "add-ent": (el) => addTile(newTileFor(el.dataset.id)),
  "add-typed": () => {
    const id = $("#ent-typed").value.trim();
    if (!validEntity(id)) { toast("Not an entity id: lowercase letters, digits and _ on both sides of one dot.", "warning"); return; }
    addTile(newTileFor(id));
  },
  "add-area": () => {
    if ($("#modal-root").innerHTML === "") addCell = null;
    addTile({ _k: K++, type: "area", name: "New area", tiles: [] });
  },
  "add-spacer": () => { if ($("#modal-root").innerHTML === "") addCell = null; addTile({ _k: K++, type: "spacer" }); },
  "reset-arr": () => change(() => resetArrangement(pageByKey(pageKey), orient)),
  icon: () => openIcons(),
  "set-icon": (el) => { const v = el.dataset.icon; closeModal(); change(() => { const t = locate(sel).tile; if (v) t.icon = v; else delete t.icon; }); },
  up: () => change(() => { const l = locate(sel); l.page.tiles.splice(l.index - 1, 0, l.page.tiles.splice(l.index, 1)[0]); }),
  down: () => change(() => { const l = locate(sel); l.page.tiles.splice(l.index + 1, 0, l.page.tiles.splice(l.index, 1)[0]); }),
  dup: () => change(() => {
    const l = locate(sel), c = clone(l.tile);
    (function strip(t) { delete t.id; delete t.landscape; delete t.portrait; t._k = K++; if (t.tiles) t.tiles.forEach(strip); })(c);
    l.page.tiles.splice(l.index + 1, 0, c);
    sel = c._k;
  }),
  del: () => {
    const l = locate(sel), n = l.tile.tiles ? countTiles(l.tile.tiles) : 0;
    if (n && !confirm(`Remove ${displayName(l.tile)} and its ${n} tiles?`)) return;
    change(() => { l.page.tiles.splice(l.index, 1); sel = null; if (!pages().some((x) => x.key === pageKey)) pageKey = l.page.key; });
  },
  "dl-yaml": () => download("hass.yaml", yamlText(), "text/yaml"),
  "show-yaml": () => modal("hass.yaml", `<pre class="code mb-0">${esc(yamlText())}</pre>`, "", "modal-lg"),
  demo: () => toast("Not in the demo.", "secondary"),
  close: () => closeModal(),
  "modal-bg": (el, e) => { if (e.target === el) closeModal(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) {
    // a click on a tile of the editor's preview selects it
    const t = e.target.closest("#ed-board [data-k]");
    if (t) {
      // a second click on a selected area opens its page
      const k = +t.dataset.k;
      if (sel === k && locate(k)?.tile.type === "area") { pageKey = k; sel = null; } else sel = k;
      render();
    }
    else if (e.target.closest("#ed-board [data-back]")) { pageKey = pageByKey(pageKey).parent ?? 0; sel = null; render(); }
    return;
  }
  if (el.tagName === "A") e.preventDefault();
  actions[el.dataset.act]?.(el, e);
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.field) return setField(el.dataset.field, el);
  const ctl = el.dataset.ctl;
  if (!ctl) return;
  const p = pageByKey(pageKey);
  if (ctl === "board") { board = el.value; render(); }
  if (ctl === "page") { pageKey = +el.value; sel = null; render(); }
  if (ctl === "c409") conflictNext = el.checked;
  if (ctl === "moveto" && el.value) moveToPage(sel, +el.value);
  if (ctl === "owngrid") change(() => { if (el.checked) p.area.grid = [...doc.defaults.grid]; else delete p.area.grid; });
  if (ctl === "gcols" || ctl === "grows") {
    const g = [...gridOf(p)];
    g[ctl === "gcols" ? 0 : 1] = +el.value;
    change(() => {
      if (p.key === 0) doc.defaults.grid = g; else p.area.grid = g;
      // cells outside the new grid: offer to reset the arrangement (section 1)
      for (const o of ["l", "p"]) {
        const pl = place(p, o);
        if (Object.values(pl.errors).some((m) => m.includes("outside")) &&
            confirm(`Some ${o === "p" ? "portrait" : "landscape"} cells are outside the new grid. Reset the arrangement of ${p.name} in ${o === "p" ? "portrait" : "landscape"}?`)) resetArrangement(p, o);
      }
    });
  }
});

function setField(f, el) {
  change(() => {
    const t = locate(sel).tile, v = el.type === "checkbox" ? el.checked : el.value.trim();
    if (f === "entity") { t.entity = v; stripForKind(t); return; }
    if (f === "dimmer") { if (v) t.dimmer = true; else delete t.dimmer; return; }
    if (f === "size") { if (v) t.size = v.split("x").map(Number); else delete t.size; return; }
    if (["step", "decimals", "refresh"].includes(f)) { if (v === "") delete t[f]; else t[f] = Number(v); return; }
    if (v === "") delete t[f]; else t[f] = v;
  });
}

// ------------------------------------------------------------------------------- frame, theme

$("#menu-button").addEventListener("click", () => ($("#menu").hidden = !$("#menu").hidden));
const theme = $("#theme");
try { theme.value = localStorage.getItem("theme") || "auto"; } catch (e) {}
theme.addEventListener("change", () => {
  try { localStorage.setItem("theme", theme.value); } catch (e) {}
  const dark = theme.value === "dark" || (theme.value === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
});
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
// only a change of the width redraws: a phone keyboard changes the height and would take the focus
let resizeTimer, lastWidth = innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (innerWidth !== lastWidth) { lastWidth = innerWidth; render(); } }, 100);
});

render();
</script>
</body>
