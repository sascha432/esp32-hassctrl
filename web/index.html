<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hassctrl</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="app.css">
<script>
  // the color mode before the first paint: stored choice, else the browser's
  (function () {
    var mode = localStorage.getItem("theme") || "auto";
    var dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  })();
</script>
</head>
<body>
<header class="navbar border-bottom bg-body-tertiary sticky-top">
  <div class="container-fluid app-header">
    <a class="navbar-brand fw-semibold text-truncate" href="#/status" id="device-name">hassctrl</a>
    <div class="d-flex align-items-center gap-2">
      <span id="step" class="text-body-secondary small" hidden></span>
      <span id="icon-wifi" class="state-icon" title="Wi-Fi" hidden></span>
      <span id="icon-ha" class="state-icon small fw-bold" title="Home Assistant" hidden>HA</span>
      <button id="menu-button" class="btn btn-sm btn-outline-secondary" type="button" aria-label="Menu" hidden>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3.5h12v1H2zm0 4h12v1H2zm0 4h12v1H2z"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="app-body">
  <nav id="menu" class="app-menu border-end bg-body" hidden>
    <div class="list-group list-group-flush" id="menu-pages"></div>
    <div class="p-3 border-top">
      <label class="form-label small text-body-secondary" for="theme">Appearance</label>
      <select id="theme" class="form-select form-select-sm mb-3">
        <option value="auto">Automatic</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <button id="logout" class="btn btn-sm btn-outline-secondary w-100 mb-2" type="button">Log out</button>
      <button id="logout-all" class="btn btn-sm btn-outline-secondary w-100" type="button">Log out everywhere</button>
    </div>
  </nav>
  <main id="page" class="app-page container-fluid py-3"></main>
</div>
<div id="toast" class="app-toast alert py-2 shadow-sm" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
